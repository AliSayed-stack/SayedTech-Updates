name: Build and publish Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag that has the SayedTech source ZIP attached
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out updater metadata
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release tag
        shell: pwsh
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_EVENT_TAG) { $env:RELEASE_EVENT_TAG } else { $env:MANUAL_TAG }
          if (-not $tag) { throw 'Release tag was not provided.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download source ZIP from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\release-source" | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "SayedTech_Stage1-*.zip" --dir "$env:RUNNER_TEMP\release-source"
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP\release-source\SayedTech_Stage1-*.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one SayedTech source ZIP on release $env:RELEASE_TAG." }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "$env:RUNNER_TEMP\source" -Force
          $app = Join-Path "$env:RUNNER_TEMP\source" "SayedTech_Stage1"
          if (-not (Test-Path (Join-Path $app "build_windows.py"))) { throw 'Source ZIP does not contain SayedTech_Stage1/build_windows.py.' }
          "APP_SOURCE=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and self-test Windows installer
        shell: pwsh
        run: |
          Set-Location "$env:APP_SOURCE"
          python build_windows.py
          $installer = Join-Path "$env:APP_SOURCE" "dist\SayedTech-Setup-Windows-x64.exe"
          if (-not (Test-Path $installer)) { throw 'Windows installer build did not produce the expected EXE.' }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Select-String -Path "core.py" -Pattern "^APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]").Matches[0].Groups[1].Value
          if (-not $version) { throw 'Could not read APP_VERSION from core.py.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach installer to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Publish verified installer in latest.json
        shell: pwsh
        run: |
          Set-Location "$env:APP_SOURCE"
          $sourceZip = @(Get-ChildItem "$env:RUNNER_TEMP\release-source\SayedTech_Stage1-*.zip")[0].FullName
          $sourceName = [IO.Path]::GetFileName($sourceZip)
          $installerName = [IO.Path]::GetFileName("$env:INSTALLER_PATH")
          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$sourceName"
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$installerName"
          python publish_update.py --version "$env:APP_VERSION" --source "$sourceZip" --source-url "$sourceUrl" --installer "$env:INSTALLER_PATH" --installer-url "$installerUrl" --output "$env:GITHUB_WORKSPACE\latest.json"
          Set-Location "$env:GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish Windows installer manifest for $env:APP_VERSION"
          git push origin HEAD:main
